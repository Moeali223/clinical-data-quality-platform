name: Clinical Data Quality CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: clinical
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: clinical_data_quality_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinical -d clinical_data_quality_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://clinical:ci_only_password@127.0.0.1:5432/clinical_data_quality_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run all tests, including PostgreSQL integration tests
        run: python -m pytest -v -W error
