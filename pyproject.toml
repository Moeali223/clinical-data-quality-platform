[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-data-quality-platform"
version = "0.1.0"
description = "A synthetic healthcare encounter data-quality portfolio project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx2>=2.13,<3", "starlette>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires a PostgreSQL database via TEST_DATABASE_URL"]
